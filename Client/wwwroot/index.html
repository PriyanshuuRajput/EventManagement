<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Dashboard</title>
    <base href="/" />

    <style>
        body {
            margin: 0;
            background: #ffffff;
        }

        .spinner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .equalizer-loader {
            display: flex;
            gap: 6px;
            height: 40px;
        }

            .equalizer-loader div {
                width: 6px;
                background: #dc3545;
                border-radius: 4px;
                animation: sound 0.7s linear infinite;
            }

                .equalizer-loader div:nth-child(1) {
                    animation-delay: 0s;
                }

                .equalizer-loader div:nth-child(2) {
                    animation-delay: 0.15s;
                }

                .equalizer-loader div:nth-child(3) {
                    animation-delay: 0.3s;
                }

                .equalizer-loader div:nth-child(4) {
                    animation-delay: 0.45s;
                }

        @keyframes sound {
            0% {
                height: 10px;
            }

            50% {
                height: 40px;
            }

            100% {
                height: 15px;
            }
        }
    </style>

    <!-- App styles (can load later) -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="logo2.png" />
</head>

<body>

    <!--  STARTUP SPINNER -->
    <div id="app">
        <div class="spinner-overlay">
            <div class="equalizer-loader">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <!-- Error UI -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- 🔹 NON-BLOCKING CSS (AFTER SPINNER) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fomantic-ui/dist/semantic.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- JS (spinner ke liye JS use nahi ho raha) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/site.js"></script>

    <!--  BLazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.initSingleDatePicker = function (dotNetObj) {
            $('#singleDatePicker').calendar({
                type: 'date',
                onChange: function (date) {
                    if (date) {
                        dotNetObj.invokeMethodAsync("OnSemanticDateSelected", date.toISOString());
                    }
                }
            });
        };

        window.clearSemanticDate = function () {
            $("#selectedDateInput").val("");
            $("#singleDatePicker").calendar("clear");
        };
    </script>
    <script>
        window.scrollByAmount = (element, amount) => {
            element.scrollBy({
                left: amount,
                behavior: 'smooth'
            });
        };

    </script>

</body>
</html>
